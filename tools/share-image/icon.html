<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <title>Home-screen icon (design page)</title>
  <!-- Design page for the phone home-screen icons (not part of the website).
       Same lit "P" as assets/images/icon.svg, but square to the edges
       (phones round the corners themselves) and with more space around the P,
       so Android can cut it into a circle without touching the letter.
       Open at the icon size (180, 192 or 512 px square) and take a screenshot. -->
  <style>
    html, body { margin: 0; height: 100%; background: #2a1c2e; }
    svg { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <svg viewBox="0 0 64 64" aria-hidden="true">
    <defs>
      <radialGradient id="light" cx="62%" cy="22%" r="80%">
        <stop offset="0" stop-color="#f7b538" stop-opacity=".3"/>
        <stop offset=".6" stop-color="#f7b538" stop-opacity="0"/>
      </radialGradient>
      <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
        <feGaussianBlur stdDeviation="1.6"/>
      </filter>
    </defs>
    <rect width="64" height="64" fill="#2a1c2e"/>
    <rect width="64" height="64" fill="url(#light)"/>
    <!-- P scaled to 62% and centred: stays inside the safe circle -->
    <g fill-rule="evenodd" transform="translate(32 32) scale(.62) translate(-35 -32)">
      <path fill="#f7b538" opacity=".55" filter="url(#glow)"
            d="M19 10H36C45.5 10 51 15.5 51 24V28C51 36.5 45.5 42 36 42H29.5V54H19ZM29.5 19V33H35C38.8 33 40.5 31.2 40.5 28V24C40.5 20.8 38.8 19 35 19Z"/>
      <path fill="#f6e9d8"
            d="M19 10H36C45.5 10 51 15.5 51 24V28C51 36.5 45.5 42 36 42H29.5V54H19ZM29.5 19V33H35C38.8 33 40.5 31.2 40.5 28V24C40.5 20.8 38.8 19 35 19Z"/>
    </g>
  </svg>
</body>
</html>
